server {
    listen 8080;
    server_name _;

    # Proxies to the Control API Kubernetes Service. Update the
    # hostname/port here if the Service name changes when the Helm
    # templates are created (Zi 17-18).
    location /api/ {
        proxy_pass http://control-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
