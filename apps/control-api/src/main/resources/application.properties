spring.application.name=envforge-control-api

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.show-details=when-authorized

info.app.name=EnvForge Control API
info.app.description=Control plane API for temporary AKS environments
info.app.version=0.1.0

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/envforge}
spring.datasource.username=${DB_USERNAME:envforge}
spring.datasource.password=${DB_PASSWORD:envforge-local-password}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true