# Microsoft Entra ID resource server config (Ziua 31).
# Active only when running with --spring.profiles.active=entra ; the default
# profile (dev/test) never loads this file, so tests and local dev keep
# working without network access to Microsoft's identity platform.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:90bc7298-1c17-48c6-830b-e88b375f216d}/v2.0
envforge.security.entra.client-id=${AZURE_CLIENT_ID:d622b3a8-cbc4-44bc-9444-ca18774574ef}

# Bootstrap admin (Ziua 32): primul login cu acest email primeste automat
# rolul ADMIN, ca sa poata promova pe altcineva prin PUT /api/users/{id}/role.
# Fara asta, nimeni nu ar putea ajunge vreodata la acel endpoint (el insusi
# protejat de ADMIN).
envforge.security.bootstrap-admin-email=${ENVFORGE_BOOTSTRAP_ADMIN_EMAIL:silvius.lombrea04@e-uvt.ro}
