spring:
  datasource:
    url: jdbc:h2:mem:cleanup-worker-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

envforge:
  lifecycle:
    max-retries: 3
    retry-delay-seconds: 1
    job-timeout-seconds: 30
    scheduler-enabled: false
    scheduler-delay-milliseconds: 10000
    batch-size: 10
