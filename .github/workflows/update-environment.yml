name: Update Environment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target STATIC_WEB version (x.y.z)"
        required: true
        default: "0.2.1"
        type: string

jobs:
  update-environment:
    name: Validate environment update through Control API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KIND_CLUSTER_NAME: envforge-update-ci
      ENV_NAME: m2-update-ci
      ENV_NAMESPACE: env-m2-update-ci
      INITIAL_VERSION: "0.2.0"
      TARGET_VERSION: ${{ inputs.version }}
      EXPECTED_TRIGGERED_BY: dev@envforge.local
      IMAGE_REPOSITORY: envforge/static-web-demo
      WORKLOAD_CHART_PATH: deployment/helm/envforge-workload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/control-api/pom.xml

      - name: Validate target version
        shell: bash
        run: |
          if [[ ! "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format"
            exit 1
          fi

          if [ "${TARGET_VERSION}" = "${INITIAL_VERSION}" ]; then
            echo "Target version must differ from ${INITIAL_VERSION}"
            exit 1
          fi

          echo "Updating ${INITIAL_VERSION} -> ${TARGET_VERSION}"

      - name: Verify deployment tools
        shell: bash
        run: |
          docker --version
          kubectl version --client
          helm version
          java -version
          mvn -version

      - name: Install Kind
        shell: bash
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Create temporary Kind cluster
        shell: bash
        run: |
          "$(go env GOPATH)/bin/kind" create cluster \
            --name "${KIND_CLUSTER_NAME}"

          kubectl cluster-info \
            --context "kind-${KIND_CLUSTER_NAME}"

      - name: Build environment images
        shell: bash
        run: |
          docker build \
            -t "${IMAGE_REPOSITORY}:${INITIAL_VERSION}" \
            apps/static-web-demo

          docker tag \
            "${IMAGE_REPOSITORY}:${INITIAL_VERSION}" \
            "${IMAGE_REPOSITORY}:${TARGET_VERSION}"

          docker image inspect \
            "${IMAGE_REPOSITORY}:${INITIAL_VERSION}" \
            >/dev/null

          docker image inspect \
            "${IMAGE_REPOSITORY}:${TARGET_VERSION}" \
            >/dev/null

      - name: Load images into Kind
        shell: bash
        run: |
          kind load docker-image \
            "${IMAGE_REPOSITORY}:${INITIAL_VERSION}" \
            --name "${KIND_CLUSTER_NAME}"

          kind load docker-image \
            "${IMAGE_REPOSITORY}:${TARGET_VERSION}" \
            --name "${KIND_CLUSTER_NAME}"

      - name: Start PostgreSQL
        shell: bash
        run: |
          docker run \
            --detach \
            --name envforge-postgres-ci \
            --env POSTGRES_DB=envforge \
            --env POSTGRES_USER=envforge \
            --env POSTGRES_PASSWORD=envforge-local-password \
            --publish 5432:5432 \
            postgres:17-alpine

          for i in $(seq 1 60); do
            if docker exec envforge-postgres-ci \
              pg_isready \
              -U envforge \
              -d envforge \
              >/dev/null 2>&1; then
              echo "PASS: PostgreSQL is ready"
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL did not become ready"
          docker logs envforge-postgres-ci
          exit 1

      - name: Start Control API
        shell: bash
        run: |
          (
            cd apps/control-api

            ENVFORGE_KUBE_CONTEXT="kind-${KIND_CLUSTER_NAME}" \
            ENVFORGE_HELM_CHART_PATH="${GITHUB_WORKSPACE}/${WORKLOAD_CHART_PATH}" \
            mvn spring-boot:run
          ) >/tmp/envforge-control-api.log 2>&1 &

          echo $! >/tmp/envforge-control-api.pid

          for i in $(seq 1 90); do
            if curl -fsS \
              http://127.0.0.1:8080/actuator/health \
              >/dev/null 2>&1; then
              echo "PASS: Control API is ready"
              exit 0
            fi

            if ! kill -0 \
              "$(cat /tmp/envforge-control-api.pid)" \
              2>/dev/null; then
              echo "Control API stopped unexpectedly"
              cat /tmp/envforge-control-api.log
              exit 1
            fi

            sleep 2
          done

          echo "Control API did not become ready"
          cat /tmp/envforge-control-api.log
          exit 1

      - name: Create initial environment
        id: environment
        shell: bash
        run: |
          CREATE_BODY="$(
            python3 -c '
          import json
          import os

          print(json.dumps({
              "name": os.environ["ENV_NAME"],
              "template": "STATIC_WEB",
              "imageVersion": os.environ["INITIAL_VERSION"],
              "replicas": 1,
              "resourceProfile": "SMALL",
              "lifetimeHours": 4,
              "monitoringEnabled": False
          }))
          '
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "${CREATE_BODY}" \
            http://127.0.0.1:8080/api/environments \
            > /tmp/environment-create.json

          cat /tmp/environment-create.json

          ENV_ID="$(
            python3 -c '
          import json

          with open("/tmp/environment-create.json") as file:
              print(json.load(file)["id"])
          '
          )"

          echo "environment_id=${ENV_ID}" \
            >> "${GITHUB_OUTPUT}"

          echo "Environment ID: ${ENV_ID}"

      - name: Verify initial environment
        shell: bash
        env:
          ENV_ID: ${{ steps.environment.outputs.environment_id }}
        run: |
          for i in $(seq 1 60); do
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              "http://127.0.0.1:8080/api/environments/${ENV_ID}" \
              > /tmp/environment.json

            STATUS="$(
              python3 -c '
          import json

          with open("/tmp/environment.json") as file:
              print(json.load(file)["status"])
          '
            )"

            echo "Environment status: ${STATUS}"

            if [ "${STATUS}" = "READY" ]; then
              break
            fi

            if [ "${STATUS}" = "FAILED" ]; then
              cat /tmp/environment.json
              exit 1
            fi

            sleep 2
          done

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/environment.json") as file:
              environment = json.load(file)

          assert environment["status"] == "READY", environment
          assert environment["imageVersion"] == os.environ["INITIAL_VERSION"], environment

          print("PASS: initial environment is READY")
          PY

          kubectl \
            --context "kind-${KIND_CLUSTER_NAME}" \
            rollout status \
            deployment/"${ENV_NAME}-envforge-workload" \
            --namespace "${ENV_NAMESPACE}" \
            --timeout=120s

      - name: PATCH environment version
        shell: bash
        env:
          ENV_ID: ${{ steps.environment.outputs.environment_id }}
        run: |
          PATCH_BODY="$(
            python3 -c '
          import json
          import os

          print(json.dumps({
              "version": os.environ["TARGET_VERSION"]
          }))
          '
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X PATCH \
            -H 'Content-Type: application/json' \
            -d "${PATCH_BODY}" \
            "http://127.0.0.1:8080/api/environments/${ENV_ID}" \
            > /tmp/deployment-update.json

          cat /tmp/deployment-update.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/deployment-update.json") as file:
              deployment = json.load(file)

          assert deployment["requestedVersion"] == os.environ["TARGET_VERSION"], deployment
          assert deployment["status"] == "SUCCESS", deployment
          assert deployment["triggeredBy"] == os.environ["EXPECTED_TRIGGERED_BY"], deployment
          assert deployment["failureReason"] is None, deployment
          assert deployment["finishedAt"] is not None, deployment

          print(
              "PASS: PATCH returned SUCCESS for actor "
              + deployment["triggeredBy"]
          )
          PY

      - name: Verify Kubernetes rollout
        shell: bash
        run: |
          kubectl \
            --context "kind-${KIND_CLUSTER_NAME}" \
            rollout status \
            deployment/"${ENV_NAME}-envforge-workload" \
            --namespace "${ENV_NAMESPACE}" \
            --timeout=120s

          ACTUAL_IMAGE="$(
            kubectl \
              --context "kind-${KIND_CLUSTER_NAME}" \
              get deployment \
              "${ENV_NAME}-envforge-workload" \
              --namespace "${ENV_NAMESPACE}" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          EXPECTED_IMAGE="${IMAGE_REPOSITORY}:${TARGET_VERSION}"

          echo "Expected image: ${EXPECTED_IMAGE}"
          echo "Actual image:   ${ACTUAL_IMAGE}"

          test "${ACTUAL_IMAGE}" = "${EXPECTED_IMAGE}"

      - name: Verify environment state
        shell: bash
        env:
          ENV_ID: ${{ steps.environment.outputs.environment_id }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            "http://127.0.0.1:8080/api/environments/${ENV_ID}" \
            > /tmp/environment-final.json

          cat /tmp/environment-final.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/environment-final.json") as file:
              environment = json.load(file)

          assert environment["status"] == "READY", environment
          assert environment["imageVersion"] == os.environ["TARGET_VERSION"], environment

          print("PASS: environment state updated")
          PY

      - name: Verify deployment history
        shell: bash
        env:
          ENV_ID: ${{ steps.environment.outputs.environment_id }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            "http://127.0.0.1:8080/api/environments/${ENV_ID}/deployments" \
            > /tmp/deployment-history.json

          cat /tmp/deployment-history.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/deployment-history.json") as file:
              history = json.load(file)

          matching = [
              deployment
              for deployment in history
              if deployment["requestedVersion"]
              == os.environ["TARGET_VERSION"]
              and deployment["status"] == "SUCCESS"
              and deployment["triggeredBy"]
              == os.environ["EXPECTED_TRIGGERED_BY"]
          ]

          if not matching:
              raise SystemExit(
                  "No successful deployment history entry found "
                  "for authenticated actor "
                  + os.environ["EXPECTED_TRIGGERED_BY"]
              )

          print(
              "PASS: deployment history contains successful update "
              "for actor "
              + matching[0]["triggeredBy"]
          )
          PY

          helm \
            --kube-context "kind-${KIND_CLUSTER_NAME}" \
            history "${ENV_NAME}" \
            --namespace "${ENV_NAMESPACE}"

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== Control API log ====="
          cat /tmp/envforge-control-api.log 2>/dev/null || true

          echo "===== Kubernetes resources ====="
          kubectl \
            --context "kind-${KIND_CLUSTER_NAME}" \
            get all \
            --all-namespaces \
            -o wide || true

          echo "===== Helm releases ====="
          helm \
            --kube-context "kind-${KIND_CLUSTER_NAME}" \
            list \
            --all-namespaces || true

          echo "===== Events ====="
          kubectl \
            --context "kind-${KIND_CLUSTER_NAME}" \
            get events \
            --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/envforge-control-api.pid ]; then
            kill \
              "$(cat /tmp/envforge-control-api.pid)" \
              2>/dev/null || true
          fi

          docker rm \
            --force envforge-postgres-ci \
            >/dev/null 2>&1 || true

          kind delete cluster \
            --name "${KIND_CLUSTER_NAME}" \
            >/dev/null 2>&1 || true
