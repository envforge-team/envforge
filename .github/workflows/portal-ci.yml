name: Portal CI

on:
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal-ci.yml"

jobs:
  build-and-lint:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
