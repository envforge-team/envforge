name: Lifecycle Kind validation

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "apps/cleanup-worker/**"
      - "apps/control-api/**"
      - "deployment/helm/envforge-workload/**"
      - "scripts/lifecycle-kind-e2e.sh"
      - "scripts/lifecycle-rollback-kind-e2e.sh"
      - ".github/workflows/lifecycle-kind-validation.yml"

  push:
    branches:
      - main
    paths:
      - "apps/cleanup-worker/**"
      - "apps/control-api/**"
      - "deployment/helm/envforge-workload/**"
      - "scripts/lifecycle-kind-e2e.sh"
      - "scripts/lifecycle-rollback-kind-e2e.sh"
      - ".github/workflows/lifecycle-kind-validation.yml"

permissions:
  contents: read

concurrency:
  group: lifecycle-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-kind:
    name: Delete expiration and rollback on Kind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          kubectl_version: v1.32.2
          cluster_name: envforge
          wait: 120s

      - name: Start PostgreSQL
        run: |
          docker compose up -d postgres

          for i in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U envforge -d envforge; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs postgres
          exit 1

      - name: Build and load demo image
        run: |
          docker build \
            --tag envforge/static-web-demo:0.2.0 \
            apps/static-web-demo

          kind load docker-image \
            envforge/static-web-demo:0.2.0 \
            --name envforge

      - name: Start Control API
        run: |
          cd apps/control-api

          ENVFORGE_KUBE_CONTEXT=kind-envforge \
          ENVFORGE_HELM_CHART_PATH="${GITHUB_WORKSPACE}/deployment/helm/envforge-workload" \
          ./mvnw -B spring-boot:run \
            > /tmp/control-api.log 2>&1 &

          echo $! > /tmp/control-api.pid

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health \
              > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/control-api.log
          exit 1

      - name: Start cleanup-worker in real Kind mode
        run: |
          cd apps/cleanup-worker

          ENVFORGE_LIFECYCLE_RUNNER_MODE=real \
          ENVFORGE_KUBE_CONTEXT=kind-envforge \
          mvn -B spring-boot:run \
            > /tmp/cleanup-worker.log 2>&1 &

          echo $! > /tmp/cleanup-worker.pid

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health \
              > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/cleanup-worker.log
          exit 1

      - name: Validate delete and expiration
        run: |
          chmod +x scripts/lifecycle-kind-e2e.sh
          ./scripts/lifecycle-kind-e2e.sh

      - name: Validate rollback
        run: |
          chmod +x scripts/lifecycle-rollback-kind-e2e.sh
          ./scripts/lifecycle-rollback-kind-e2e.sh

      - name: Show diagnostics
        if: always()
        run: |
          echo "=== Kubernetes ==="
          kubectl get namespaces || true
          kubectl get pods -A || true
          helm list -A || true

          echo "=== Control API log ==="
          tail -200 /tmp/control-api.log 2>/dev/null || true

          echo "=== Cleanup worker log ==="
          tail -200 /tmp/cleanup-worker.log 2>/dev/null || true
