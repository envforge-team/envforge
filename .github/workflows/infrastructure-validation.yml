name: Infrastructure validation

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-validation.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-validation.yml"

permissions:
  contents: read

concurrency:
  group: infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Display Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: |
          terraform fmt \
            -check \
            -recursive \
            -diff \
            infrastructure

      - name: Initialize dev environment without backend
        run: |
          terraform \
            -chdir=infrastructure/environments/dev \
            init \
            -backend=false \
            -input=false \
            -no-color

      - name: Validate dev environment
        run: |
          terraform \
            -chdir=infrastructure/environments/dev \
            validate \
            -no-color

      - name: Validate reusable modules
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r MODULE_DIRECTORY
          do
            echo "Validating ${MODULE_DIRECTORY}"

            terraform \
              -chdir="${MODULE_DIRECTORY}" \
              init \
              -backend=false \
              -input=false \
              -no-color

            terraform \
              -chdir="${MODULE_DIRECTORY}" \
              validate \
              -no-color
          done < <(
            find infrastructure/modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort
          )
          