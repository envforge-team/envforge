name: Cleanup Worker CI
on:
  pull_request:
    paths:
      - "apps/cleanup-worker/**"
      - "apps/control-api/src/main/resources/db/migration/**"
      - ".github/workflows/cleanup-worker-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/cleanup-worker/**"
      - "apps/control-api/src/main/resources/db/migration/**"
      - ".github/workflows/cleanup-worker-ci.yml"
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: envforge
          POSTGRES_USER: envforge
          POSTGRES_PASSWORD: envforge-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # cleanup-worker's schema is owned by control-api's Flyway
      # migrations (ddl-auto: validate, flyway disabled locally). Boot
      # control-api briefly against the same Postgres service so its
      # migrations run, then stop it before testing cleanup-worker.
      - name: Apply database schema via control-api migrations
        working-directory: apps/control-api
        run: |
          ./mvnw -B spring-boot:run > /tmp/control-api-migrate.log 2>&1 &
          RUN_PID=$!
          READY=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          kill "$RUN_PID" 2>/dev/null || true
          wait "$RUN_PID" 2>/dev/null || true
          if [ "$READY" != "1" ]; then
            echo "control-api did not become healthy; migrations may not have applied"
            cat /tmp/control-api-migrate.log
            exit 1
          fi
      - name: Compile
        working-directory: apps/cleanup-worker
        run: mvn -B compile
      - name: Run tests
        working-directory: apps/cleanup-worker
        run: mvn -B test
      - name: Package
        working-directory: apps/cleanup-worker
        run: mvn -B package -DskipTests
