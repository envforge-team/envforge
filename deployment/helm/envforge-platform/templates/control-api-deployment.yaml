apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: control-api
    {{- include "envforge-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-api
        {{- include "envforge-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: control-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-api
          image: "{{ .Values.controlApi.image.repository }}:{{ .Values.controlApi.image.tag }}"
          imagePullPolicy: {{ .Values.controlApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_URL
              value: {{ .Values.controlApi.env.dbUrl | quote }}
            - name: DB_USERNAME
              value: {{ .Values.controlApi.env.dbUsername | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-api-db
                  key: db-password
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
                    startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
