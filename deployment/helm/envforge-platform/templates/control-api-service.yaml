apiVersion: v1
kind: Service
metadata:
  # Fixed name (not templated with the release name): the Portal's
  # nginx.conf proxies to http://control-api:8080 by DNS name.
  name: control-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: control-api
    {{- include "envforge-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: control-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.controlApi.service.port }}
      targetPort: http
