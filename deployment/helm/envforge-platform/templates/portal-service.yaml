apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: portal
    {{- include "envforge-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portal
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.portal.service.port }}
      targetPort: http
