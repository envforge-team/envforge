{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: control-api
    {{- include "envforge-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the portal may call the Control API directly.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress, needed later for Entra ID / Azure API calls
    # (Săptămâna 7).
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}
