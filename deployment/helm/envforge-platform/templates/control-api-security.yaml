{{- if .Values.rbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: control-api
    {{- include "envforge-platform.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-api-read
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: control-api
    {{- include "envforge-platform.labels" . | nindent 4 }}
rules:
  # Read-only for now (status/health display). Write access for
  # provisioning environments happens via Helm in CI, not from inside
  # this pod. Revisit if that changes.
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-api-read
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: control-api
    {{- include "envforge-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: control-api
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: control-api-read
  apiGroup: rbac.authorization.k8s.io
{{- end }}
