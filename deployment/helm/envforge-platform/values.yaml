nameOverride: ""
fullnameOverride: ""

namespace: envforge-platform

controlApi:
  image:
    repository: envforge/control-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    dbUrl: "jdbc:postgresql://postgres:5432/envforge"
    dbUsername: "envforge"
    # TODO (Săptămâna 7): move to a Kubernetes Secret / Azure Key Vault
    # instead of a plain value.
    dbPassword: "envforge-local-password"

portal:
  image:
    repository: envforge/portal
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80

rbac:
  enabled: true

networkPolicy:
  enabled: true
