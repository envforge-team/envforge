nameOverride: ""
fullnameOverride: ""

namespace: envforge-platform

controlApi:
  image:
    repository: envforge/control-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    dbUrl: "jdbc:postgresql://postgres:5432/envforge"
    dbUsername: "envforge"
    # Sourced into a Kubernetes Secret (control-api-secret.yaml) instead of
    # a plain env var (Ziua 33). TODO: move this value itself out of
    # values.yaml into Azure Key Vault for non-local environments.
    dbPassword: "envforge-local-password"

portal:
  image:
    repository: envforge/portal
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80

rbac:
  enabled: true

networkPolicy:
  enabled: true
