{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.metrics.service.name }}
  namespace: env-{{ .Values.environmentName }}
  labels:
    app: reliability-demo-api
    app.kubernetes.io/managed-by: envforge
    envforge.io/environment: {{ .Values.environmentName }}
    envforge.io/monitoring: "true"
spec:
  selector:
    app: {{ .Values.metrics.service.workloadSelector }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: {{ .Values.metrics.service.targetPort }}
      protocol: TCP
  type: ClusterIP
{{- end }}
