{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reliability-demo-api
  namespace: env-{{ .Values.environmentName }}
  labels:
    app.kubernetes.io/managed-by: envforge
    envforge.io/environment: {{ .Values.environmentName }}
    envforge.io/component: monitoring
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      envforge.io/monitoring: "true"

  endpoints:
    - port: metrics
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
