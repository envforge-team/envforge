apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: env-{{ .Values.environmentName }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/managed-by: envforge
    envforge.io/environment: {{ .Values.environmentName }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP
