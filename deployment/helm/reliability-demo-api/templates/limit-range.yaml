apiVersion: v1
kind: LimitRange
metadata:
  name: envforge-container-limits
  namespace: env-{{ .Values.environmentName }}
  labels:
    app.kubernetes.io/managed-by: envforge
    envforge.io/environment: {{ .Values.environmentName }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu }}
        memory: {{ .Values.limitRange.defaultRequestMemory }}
      default:
        cpu: {{ .Values.limitRange.defaultCpu }}
        memory: {{ .Values.limitRange.defaultMemory }}
      min:
        cpu: {{ .Values.limitRange.minCpu }}
        memory: {{ .Values.limitRange.minMemory }}
      max:
        cpu: {{ .Values.limitRange.maxCpu | quote }}
        memory: {{ .Values.limitRange.maxMemory }}
