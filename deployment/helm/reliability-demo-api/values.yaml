environmentName: reliability-demo
owner: raoul
template: reliability-api

replicaCount: 2

image:
  repository: reliability-demo-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

quota:
  requestsCpu: "1"
  requestsMemory: 1Gi
  limitsCpu: "2"
  limitsMemory: 2Gi
  pods: "10"
  services: "5"
  configmaps: "10"
  secrets: "10"

limitRange:
  defaultRequestCpu: 100m
  defaultRequestMemory: 128Mi
  defaultCpu: 250m
  defaultMemory: 256Mi
  minCpu: 50m
  minMemory: 64Mi
  maxCpu: "1"
  maxMemory: 1Gi

readinessProbe:
  path: /ready
  initialDelaySeconds: 60
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  path: /health
  initialDelaySeconds: 75
  periodSeconds: 10
  failureThreshold: 3

extraEnv: []
