{{- if .Values.quota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "envforge-workload.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "envforge-workload.labels" . | nindent 4 }}
  annotations:
    envforge.io/expires-at: {{ .Values.environment.expiresAt | quote }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requests.cpu | quote }}
    requests.memory: {{ .Values.quota.requests.memory | quote }}
    limits.cpu: {{ .Values.quota.limits.cpu | quote }}
    limits.memory: {{ .Values.quota.limits.memory | quote }}
    pods: {{ .Values.quota.objectCounts.pods | quote }}
    services: {{ .Values.quota.objectCounts.services | quote }}
    configmaps: {{ .Values.quota.objectCounts.configMaps | quote }}
    secrets: {{ .Values.quota.objectCounts.secrets | quote }}
{{- end }}