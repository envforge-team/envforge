apiVersion: v1
kind: ResourceQuota
metadata:
  name: envforge-resource-quota
  namespace: env-static-demo-m1
  labels:
    app.kubernetes.io/managed-by: "envforge"
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    services: "5"
    configmaps: "10"
    secrets: "10"
    persistentvolumeclaims: "2"