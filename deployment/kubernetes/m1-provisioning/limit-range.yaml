apiVersion: v1
kind: LimitRange
metadata:
  name: envforge-container-limits
  namespace: env-static-demo-m1
  labels:
    app.kubernetes.io/managed-by: envforge
    envforge.io/environment: static-demo-m1
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi