apiVersion: v1
kind: ResourceQuota
metadata:
  name: envforge-environment-quota
  namespace: env-reliability-demo
  labels:
    app.kubernetes.io/managed-by: envforge
    envforge.io/environment: reliability-demo
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    services: "5"
    configmaps: "10"
    secrets: "10"
